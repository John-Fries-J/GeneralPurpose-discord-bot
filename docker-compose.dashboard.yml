services:
  bot:
    build: .
    container_name: generalpurpose-discord-bot
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./language.json:/app/language.json
      - ./data:/app/data
    environment:
      CONFIG_PATH: "${CONFIG_PATH:-/app/data/config.json}"
      DASHBOARD_ENABLED: "true"
      DASHBOARD_HOST: "0.0.0.0"
      DASHBOARD_PORT: "3000"
      DASHBOARD_PUBLIC_URL: "https://${DASHBOARD_DOMAIN}"
      DISCORD_OAUTH_REDIRECT_URI: "https://${DASHBOARD_DOMAIN}/auth/discord/callback"
